<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="theme-color" content="#e0392e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#c22e24" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>筋トレ記録 — 部位バランス</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --accent: #d63127;
  --accent-ink: #ffffff;
  --hdr: #e0392e;
  --hdr-ink: #ffffff;
  --fab: #22a447;
  --heat-0: #f0efec;
  --heat-1: #fddcd7;
  --heat-2: #f8b4aa;
  --heat-3: #f08b7d;
  --heat-4: #e05c50;
  --heat-5: #c03a34;
  --heat-6: #8f2220;
  --star: #eda100;
  --danger: #d03b3b;
  --good: #0ca30c;
  --sheet-shadow: 0 -8px 30px rgba(0,0,0,0.18);
}
/* ダーク配色(視認性改善版): 文字・罫線のコントラストを上げ、ヒートは「熱いほど明るい」ランプに */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1d1d1b;
    --page: #101010;
    --text-primary: #f5f4f1;
    --text-secondary: #cfcec9;
    --text-muted: #a3a19a;
    --grid: #343431;
    --baseline: #4a4a45;
    --border: rgba(255,255,255,0.16);
    --series-1: #5d9ceb;
    --accent: #f0685c;
    --accent-ink: #ffffff;
    --hdr: #b02a21;
    --hdr-ink: #ffffff;
    --fab: #2bb552;
    --heat-0: #30302d;
    --heat-1: #6d2521;
    --heat-2: #96322b;
    --heat-3: #c04436;
    --heat-4: #e0604c;
    --heat-5: #f28a6c;
    --heat-6: #ffb49d;
    --star: #f5b433;
    --danger: #ef7d7d;
    --good: #3fbf3f;
    --sheet-shadow: 0 -8px 30px rgba(0,0,0,0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1d1d1b;
  --page: #101010;
  --text-primary: #f5f4f1;
  --text-secondary: #cfcec9;
  --text-muted: #a3a19a;
  --grid: #343431;
  --baseline: #4a4a45;
  --border: rgba(255,255,255,0.16);
  --series-1: #5d9ceb;
  --accent: #f0685c;
  --accent-ink: #ffffff;
  --hdr: #b02a21;
  --hdr-ink: #ffffff;
  --fab: #2bb552;
  --heat-0: #30302d;
  --heat-1: #6d2521;
  --heat-2: #96322b;
  --heat-3: #c04436;
  --heat-4: #e0604c;
  --heat-5: #f28a6c;
  --heat-6: #ffb49d;
  --star: #f5b433;
  --danger: #ef7d7d;
  --good: #3fbf3f;
  --sheet-shadow: 0 -8px 30px rgba(0,0,0,0.55);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html { height:100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--text-primary);
  min-height: 100%;
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
}
/* コンテンツが短いタブ(空の履歴など)でもページの高さを一定に保ち、
   iOSのツールバー/タブバーがぐいっと動くのを防ぐ */
.app {
  max-width: 520px; margin: 0 auto; padding: 12px 14px 24px;
  min-height: calc(100vh - 120px);
  min-height: calc(100svh - 120px);
}
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--hdr); color: var(--hdr-ink);
  padding-top: env(safe-area-inset-top);
}
.tb-inner {
  max-width: 520px; margin: 0 auto; padding: 12px 16px;
  display:flex; justify-content:space-between; align-items:baseline;
}
.tb-inner h1 { font-size: 19px; font-weight: 800; letter-spacing: 0.02em; }
.tb-inner .sub { font-size: 12px; opacity: 0.9; }

/* ---- tab bar ---- */
nav.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--surface-1);
  border-top: 1px solid var(--border);
  display:flex;
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabbar button {
  flex:1; background:none; border:none; padding: 8px 0 6px;
  font-family: inherit;
  font-size: 10.5px; color: var(--text-muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabbar button svg { width:24px; height:24px; stroke: currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
nav.tabbar button.active { color: var(--accent); font-weight:600; }

/* ---- cards & common ---- */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card h2 { font-size: 14px; font-weight: 650; margin-bottom: 10px; color: var(--text-primary); }
.muted { color: var(--text-muted); font-size: 12px; }
.secondary { color: var(--text-secondary); }
button.primary {
  width:100%; padding: 13px; border:none; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 16px; font-weight: 650; cursor:pointer; font-family:inherit;
}
button.primary:disabled { opacity: 0.4; }
button.ghost {
  padding: 8px 12px; border:1px solid var(--border); border-radius: 10px;
  background: none; color: var(--text-primary); font-size: 13px; cursor:pointer; font-family:inherit;
}
button.ghost.danger { color: var(--danger); }
input, select {
  font-family: inherit; font-size: 16px;
  background: var(--page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display:flex; gap:8px; align-items:center; }
.spread { display:flex; justify-content:space-between; align-items:center; }

.view { display:none; }
.view.active { display:block; }

/* ---- record view ---- */
/* 回数セレクトの「提案値」表示(未入力のときグレーで前回の回数を見せる。入力値ではない) */
.set-row select.sugsel { color: var(--text-muted); }

/* フォームガイド: 2ポーズの交互表示(GIF風)+効かせる部位の赤い脈動 */
.fg-wrap { background: var(--heat-0); border-radius: 12px; padding: 6px 4px 2px; }
.fg-wrap svg { width: 100%; height: auto; display: block; }
.fg-body { stroke: var(--text-secondary); stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fg-head { fill: var(--text-secondary); }
.fg-gear { stroke: var(--baseline); stroke-width: 5; fill: none; stroke-linecap: round; }
.fg-plate { fill: var(--baseline); }
.fg-floor { stroke: var(--grid); stroke-width: 2; }
.fg-label { font-size: 10.5px; fill: var(--text-muted); font-weight: 650; }
.fg-p1 { animation: fgA 3.6s infinite; }
.fg-p2 { animation: fgB 3.6s infinite; }
@keyframes fgA { 0%, 42% { opacity: 1; } 50%, 92% { opacity: 0; } 100% { opacity: 1; } }
@keyframes fgB { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 100% { opacity: 0; } }
.fg-pulse { fill: var(--accent); animation: fgPulse 1.2s ease-in-out infinite; }
@keyframes fgPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
.fg-cue { font-size: 12.5px; line-height: 1.75; color: var(--text-secondary); margin-top: 4px; }
.fg-feel { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--accent); line-height: 1.6; }
/* 検索中は「ルーティン/今週のおすすめ」を上にスライドして畳む */
#topWrap { overflow:hidden; transition: max-height .35s ease, opacity .25s ease; }
#topWrap.collapsed { max-height: 0 !important; opacity: 0; }
.chips { display:flex; gap:6px; overflow-x:auto; padding: 2px 0 8px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chips button {
  flex:0 0 auto; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-secondary); font-size: 13px; cursor:pointer; font-family:inherit;
}
.chips button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight:600; }
.exlist { display:flex; flex-direction:column; }
.exrow { display:flex; align-items:center; border-bottom: 1px solid var(--grid); }
.exrow:last-child { border-bottom:none; }
.exrow .exmain {
  flex:1; display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding: 12px 4px; background:none; border:none;
  font-size: 15px; color: var(--text-primary); cursor:pointer; text-align:left; font-family:inherit;
}
.exlist .exmeta { font-size: 11.5px; color: var(--text-muted); }
.exlist .last { font-size: 11.5px; color: var(--text-muted); white-space:nowrap; }
.starbtn {
  background:none; border:none; font-size: 21px; line-height:1;
  color: var(--baseline); cursor:pointer; padding: 10px 6px; font-family:inherit;
}
.starbtn.on { color: var(--star); }
.draghandle {
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  color: var(--text-muted); font-size: 20px; padding: 12px 8px 12px 14px; line-height:1;
}
.exrow.dragging {
  opacity: 0.92; background: var(--page); border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18); position: relative; z-index: 5;
  border-bottom-color: transparent;
}
.sectionhead {
  display:flex; justify-content:space-between; align-items:center;
  font-size: 12px; color: var(--text-muted); padding: 4px 4px 2px; font-weight: 600;
}
.sectionhead button { background:none; border:none; color: var(--accent); font-size: 12.5px; cursor:pointer; font-family:inherit; padding:2px 0; }

/* set editor */
.set-row { display:grid; grid-template-columns: 26px 1fr 1fr 52px 30px; gap:6px; align-items:center; margin-bottom:4px; }
.set-row .setno { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.set-row input { width:100%; text-align:center; font-variant-numeric: tabular-nums; padding:10px 4px; }
.set-row button { background:none; border:none; color: var(--text-muted); font-size:18px; cursor:pointer; padding:6px; font-family:inherit; }
.set-head { display:grid; grid-template-columns: 26px 1fr 1fr 52px 30px; gap:6px; font-size:11px; color:var(--text-muted); margin-bottom:6px; }
.set-head span { text-align:center; }
.set-head span:first-child { text-align:left; }
.prevhint { font-size: 12px; color: var(--text-muted); margin: 2px 0 10px; }

/* ---- map view ---- */
.weeknav { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
.weeknav button {
  width:38px; height:38px; border-radius: 10px; border:1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); font-size: 16px; cursor:pointer; font-family:inherit;
}
.weeknav button:disabled { opacity:0.3; }
.weeknav .label { font-size: 14px; font-weight: 650; }
.weeknav .label .sub { display:block; font-size:11px; font-weight:400; color:var(--text-muted); text-align:center; }
.maps { display:flex; gap:4px; }
.maps figure { flex:1; text-align:center; }
.maps figcaption { font-size: 11.5px; color: var(--text-muted); margin-top:2px; }
.maps svg { width:100%; height:auto; display:block; }
.bodymap .muscle {
  stroke: var(--surface-1); stroke-width: 2; cursor: pointer;
  transition: opacity 0.15s;
}
.bodymap .muscle:active { opacity: 0.7; }
.bodymap .muscle:focus { outline: none; }
.bodymap .muscle:focus-visible { stroke: var(--accent); stroke-width: 2.5; }
.bodymap .muscle.selected { stroke: var(--text-primary); stroke-width:2; }
.bodymap .silhouette { fill: var(--heat-0); opacity:0.45; stroke: var(--baseline); stroke-width:1; }
.legend { display:flex; align-items:center; gap:0; margin-top: 12px; }
.legend .cell { flex:1; text-align:center; }
.legend .sw { height: 10px; border-radius: 2px; margin: 0 1px; }
.legend .lb { font-size: 9.5px; color: var(--text-muted); margin-top: 3px; white-space:nowrap; }
.legend-title { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

/* PRセレブレーション */
#prOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:200; }
#prOverlay .prcard { background:var(--surface-1); border-radius:20px; padding:26px 22px; text-align:center; width:min(320px,86vw); animation:prPop .45s cubic-bezier(.2,1.4,.4,1); }
#prOverlay .prtitle { font-size:24px; font-weight:800; color:var(--accent); letter-spacing:1px; }
#prOverlay .prex { font-size:15px; font-weight:700; margin-top:6px; }
#prOverlay .prline { margin-top:12px; font-size:14px; }
#prOverlay .prline b { font-size:19px; }
#prOverlay .prprev { color:var(--text-muted); font-size:12px; margin-top:2px; }
#prOverlay .prclose { margin-top:18px; width:100%; }
@keyframes prPop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
.confetti { position:fixed; top:-28px; font-size:20px; animation:confFall linear forwards; z-index:201; pointer-events:none; }
@keyframes confFall { to { transform:translateY(112vh) rotate(720deg); opacity:.9; } }

/* 汎用モーダル(トレーニング開始確認など) */
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:200; }
.modal-card { background:var(--surface-1); border-radius:20px; padding:24px 20px; text-align:center; width:min(320px,86vw); animation:prPop .35s cubic-bezier(.2,1.4,.4,1); }

/* summary strip */
.sumstrip { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
.sumstrip .tile { background: var(--surface-1); border:1px solid var(--border); border-radius:12px; padding: 10px 8px; text-align:center; }
.sumstrip .v { font-size: 20px; font-weight: 700; }
.sumstrip .k { font-size: 10.5px; color: var(--text-muted); }

/* ---- muscle detail sheet ---- */
.sheet-backdrop {
  position: fixed; inset:0; background: rgba(0,0,0,0.35); z-index: 50;
  opacity:0; pointer-events:none; transition: opacity 0.2s;
}
.sheet-backdrop.open { opacity:1; pointer-events:auto; }
.sheet {
  position: fixed; left:0; right:0; bottom:0; z-index: 51;
  background: var(--surface-1);
  border-radius: 18px 18px 0 0;
  box-shadow: var(--sheet-shadow);
  max-width: 520px; margin: 0 auto;
  transform: translateY(105%); transition: transform 0.25s cubic-bezier(.3,.9,.3,1);
  max-height: 78vh; overflow-y: auto;
  padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
}
.sheet.open { transform: translateY(0); }
.sheet .grip { width:36px; height:4px; border-radius:2px; background: var(--baseline); margin: 4px auto 12px; }
.sheet h3 { font-size: 18px; font-weight: 700; }
.sheet .stats { display:flex; gap:16px; margin: 10px 0 4px; }
.sheet .stats .v { font-size: 22px; font-weight:700; font-variant-numeric: tabular-nums; }
.sheet .stats .k { font-size: 11px; color: var(--text-muted); }
.contribs { margin-top: 12px; }
.contrib { margin-bottom: 12px; }
.contrib .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size: 13.5px; }
.contrib .top .val { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; white-space:nowrap; }
.contrib .roletag {
  display:inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary); margin-left: 6px; vertical-align: 1px;
}
.contrib .barwrap { height: 12px; background: var(--heat-0); border-radius: 4px; margin-top: 4px; overflow:hidden; }
.contrib .bar { height:100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width:2px; }

/* ---- history ---- */
.daycard .dayhead { font-size: 13px; font-weight: 650; margin-bottom: 6px; display:flex; justify-content:space-between; align-items:center; }
.logrow { padding: 9px 0; border-bottom: 1px solid var(--grid); }
.logrow:last-child { border-bottom: none; }
.logrow .name { font-size: 14.5px; font-weight: 550; }
.logrow .sets { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-top:1px; }
.logrow .acts { display:flex; gap:12px; margin-top:4px; }
.logrow .acts button { background:none; border:none; font-size:12px; color: var(--accent); cursor:pointer; padding:0; font-family:inherit; }
.logrow .acts button.del { color: var(--danger); }

/* ---- settings ---- */
.setting-row { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom:1px solid var(--grid); }
.setting-row:last-child { border-bottom:none; }
.setting-row label { font-size: 14px; }
.mcheck { display:grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
.mcheck label { display:flex; gap:6px; align-items:center; font-size: 13px; padding: 4px 0; }

/* toast */
#toast {
  position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); left:50%; transform: translateX(-50%) translateY(20px);
  background: var(--text-primary); color: var(--page);
  padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 550;
  opacity: 0; transition: all 0.25s; z-index: 80; pointer-events:none; white-space:nowrap;
}
#toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

.backbtn { background:none; border:none; color: var(--accent); font-size: 14px; cursor:pointer; padding: 0 0 10px; font-family:inherit; display:flex; align-items:center; gap:4px; }
.empty { text-align:center; color: var(--text-muted); font-size: 13.5px; padding: 30px 10px; }

/* ---- ホーム(赤ヒーロー+カレンダー) ---- */
.homehero, .dayhero {
  background: var(--hdr); color: #fff;
  margin: -12px -14px 14px; padding: 6px 16px 18px;
}
.cal-head { display:flex; justify-content:space-between; align-items:center; margin: 2px 0 6px; }
.cal-head .m { font-size: 24px; font-weight: 800; letter-spacing: 0.01em; }
.cal-head button { background:none; border:none; color:#fff; font-size: 20px; padding: 4px 12px; cursor:pointer; font-family:inherit; }
.cal { display:grid; grid-template-columns: repeat(7,1fr); gap: 6px 2px; text-align:center; }
.cal .dow { font-size: 10.5px; opacity: 0.9; font-weight: 700; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.5); margin-bottom: 2px; }
.cal button { background:none; border:none; color:#fff; font-family:inherit; font-size: 14.5px; padding:0; cursor:pointer; }
.cal .d { display:block; width: 38px; height: 38px; line-height: 38px; margin: 0 auto; border-radius: 50%; box-sizing:border-box; }
.cal .out { opacity: 0.35; }
.cal .trained .d { background: #fff; color: var(--hdr); font-weight: 800; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
.cal .today .d { box-shadow: inset 0 0 0 2px #fff; font-weight: 800; }
.cal .today.trained .d { box-shadow: 0 0 0 2.5px rgba(255,255,255,0.55); }
.archive { display:flex; align-items:center; gap: 12px; border-top: 1px dotted rgba(255,255,255,0.65); margin-top: 12px; padding-top: 10px; font-weight: 800; font-size: 12px; }
.archive .big { font-size: 21px; }
.archive .pill { background:#fff; color: var(--hdr); border-radius: 6px; padding: 1px 8px; font-size: 14px; }
.vt { border: 1.5px solid #fff; border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.vt .t { font-size: 12px; font-weight: 700; }
.vt .vrow { display:flex; align-items:baseline; justify-content:space-between; }
.vt .v { font-size: 26px; font-weight: 800; }
.vt .cmp { font-size: 14px; font-weight: 700; }
.vt .wk { display:grid; grid-template-columns: 42px 1fr; gap: 4px 8px; align-items:center; font-size: 10.5px; margin-top: 8px; font-weight:600; }
.vt .wkbar { height: 9px; border-radius: 2px; background: rgba(255,255,255,0.5); }
.vt .wkbar.cur { background: #fff; }
.vtrow { display:flex; gap: 10px; }
.vtrow .vt { flex:1; }
.homebtns { display:flex; gap: 10px; margin: 2px 0 14px; }
.homebtns .primary { flex: 1.6; width:auto; }
button.outline {
  flex:1; padding: 12px 8px; border: 1.5px solid var(--accent); border-radius: 12px;
  background: var(--surface-1); color: var(--accent); font-weight: 700; font-size: 14px;
  font-family: inherit; cursor: pointer;
}
.todaycard {

}

</style>
</head>

<script>
/* ================= データ定義 ================= */

// 筋肉グループ定義
const MUSCLES = [
  { id:'chest',    name:'大胸筋',        short:'胸' },
  { id:'deltF',    name:'三角筋(前・中部)', short:'肩(前・中)' },

  { id:'oblique',  name:'腹斜筋',        short:'腹斜' },
  { id:'traps',    name:'僧帽筋',        short:'僧帽' },
  { id:'lats',     name:'広背筋',        short:'広背' },
  { id:'lowback',  name:'脊柱起立筋',     short:'起立筋' },
  { id:'glutes',   name:'大臀筋',        short:'臀部' },
  { id:'quads',    name:'大腿四頭筋',     short:'四頭' },

  { id:'calves',   name:'下腿三頭筋(カーフ)', short:'カーフ' },
];
const MUSCLE_BY_ID = Object.fromEntries(MUSCLES.map(m=>[m.id,m]));

// 部位シート用: 筋肉の解説と有効なトレーニング(種目id)
const MUSCLE_INFO = {
  chest:    { desc:'胸の前面を覆う扇形の大きな筋肉。腕を前に押し出す・内側に閉じる動作の主役。上部・中部・下部に分かれ、角度を変えたプレスで満遍なく刺激できます。', ex:['benchpress','inclinepress','dbfly','dips'] },
  deltF:    { desc:'肩を丸く覆う筋肉の前・横部分。腕を前や真横に上げる動作を担当。横(中部)は肩幅を作る筋肉で、プレス系では前部に偏るためサイドレイズでの直接刺激が効きます。', ex:['ohp','sideraise','uprightrow','inclinepress'] },
  deltR:    { desc:'肩の後ろ側。腕を後ろへ引く・外にひねる動作を担当。姿勢改善や肩の丸み(後ろから見た厚み)に重要で、プル系だけでは不足しがちな部位。', ex:['rearraise','facepull','bentrow'] },
  biceps:   { desc:'上腕前面の「力こぶ」。肘を曲げる・手のひらを上に返す動作。逆手(手のひら手前)のプル種目で強く働きます。', ex:['chinup_rev','bbcurl','dbcurl','hammercurl'] },
  triceps:  { desc:'上腕後面の筋肉で、実は上腕の約3分の2を占める。肘を伸ばす動作の主役で、腕を太くしたいならまずここ。プレス系でも協働します。', ex:['dips','skullcrusher','pressdown','benchpress'] },
  forearm:  { desc:'前腕の筋肉群。握力と手首の動きを担当。プル系種目で自然に鍛えられるため、直接種目は握力がボトルネックのときに。', ex:['wristcurl','hammercurl','chinup'] },
  abs:      { desc:'お腹の前面を縦に走る「シックスパック」の筋肉。体幹を丸める動作と、重い種目で体幹を固める役割。', ex:['crunch','legraise','abroller','plank'] },
  oblique:  { desc:'脇腹を斜めに走る筋肉。体をひねる・横に倒す動作と、くびれ・体幹の安定に関与。', ex:['russiantwist','sidebend','plank'] },
  traps:    { desc:'首の付け根から左右の肩、背中の中央まで広がる大きな凧形の筋肉。上部は肩をすくめる動作、中・下部は肩甲骨を寄せる・下げる動作を担当。首〜肩のラインを作ります。', ex:['shrug','facepull','bentrow','seatedrow'] },
  lats:     { desc:'脇の下から腰へ広がる背中最大の筋肉で、「逆三角形」のシルエットを作る。腕を上から・前から体に引き寄せる動作の主役。', ex:['chinup','latpulldown','bentrow','dbrow'] },
  lowback:  { desc:'背骨の両脇を縦に走る筋肉の柱。姿勢の維持と体幹を起こす動作を担当。あらゆる種目の土台ですが回復に時間がかかるため、直接種目のやり過ぎには注意。', ex:['deadlift','backext','rdl'] },
  glutes:   { desc:'お尻の筋肉で、単体では全身最大級のパワーを持つ。股関節を伸ばす(体を起こす・押し出す)動作の主役。ヒップラインと下半身のパワーの要。', ex:['hipthrust','squat','bulgarian','rdl'] },
  quads:    { desc:'太もも前面の4つの筋肉の総称。膝を伸ばす動作の主役で、体の中でも特に体積が大きい。スクワット系の深さで刺激が大きく変わります。', ex:['squat','legpress','lunge','legext'] },
  adductor: { desc:'内ももの筋肉群。脚を閉じる動作と骨盤の安定を担当。ワイドスタンスのスクワットでもよく働きます。', ex:['adduction','squat','lunge'] },
  hams:     { desc:'太もも裏の筋肉群。膝を曲げる・股関節を伸ばす2つの動作を担当。前ももとのバランスが崩れると膝のケガにつながりやすい、重要だが手薄になりがちな部位。', ex:['rdl','legcurl','bulgarian'] },
  calves:   { desc:'ふくらはぎの筋肉。つま先立ち(かかとを上げる)動作を担当。高回数に反応しやすく、立位と座位で効く部位が少し変わります。', ex:['calfraise'] },
};

// 種目カテゴリ
const CATS = ['胸','背中','肩','腕','脚','体幹'];

// 種目データベース: m = {筋肉id: 係数}  1.0=主働筋 / 0.5=協働筋 / 0.25=補助的
const EXERCISES = [
  // --- 胸 ---
  { id:'benchpress',   cat:'胸', name:'ベンチプレス',            m:{chest:1, deltF:0.5, triceps:0.5} },
  { id:'inclinepress', cat:'胸', name:'インクラインプレス',       m:{chest:1, deltF:0.75, triceps:0.5} },

  { id:'dips',         cat:'胸', name:'ディップス',              m:{chest:1, triceps:0.75, deltF:0.5} },
  { id:'chestpress',   cat:'胸', name:'チェストプレス(マシン)',   m:{chest:1, deltF:0.5, triceps:0.5} },
  // --- 背中 ---
  { id:'deadlift',     cat:'背中', name:'デッドリフト',           m:{lowback:1, glutes:0.75, hams:0.75, lats:0.5, traps:0.5, forearm:0.5, quads:0.25} },
  { id:'chinup',       cat:'背中', name:'懸垂(順手・プルアップ)',  m:{lats:1, biceps:0.5, deltR:0.25, forearm:0.5, traps:0.25} },
  { id:'chinup_rev',   cat:'背中', name:'懸垂(逆手・チンアップ)',  m:{lats:1, biceps:0.75, forearm:0.5, traps:0.25, chest:0.25} },
  { id:'latpulldown',  cat:'背中', name:'ラットプルダウン',        m:{lats:1, biceps:0.5, deltR:0.25, traps:0.25} },
  { id:'bentrow',      cat:'背中', name:'ベントオーバーロウ',      m:{lats:1, traps:0.5, deltR:0.5, biceps:0.5, lowback:0.5, forearm:0.25} },
  { id:'seatedrow',    cat:'背中', name:'シーテッドロウ',          m:{lats:1, traps:0.5, deltR:0.5, biceps:0.5} },
  { id:'dbrow',        cat:'背中', name:'ワンハンドロウ',          m:{lats:1, traps:0.5, deltR:0.5, biceps:0.5} },
  { id:'backext',      cat:'背中', name:'バックエクステンション',   m:{lowback:1, glutes:0.5, hams:0.5} },
  // --- 肩 ---
  { id:'ohp',          cat:'肩', name:'ショルダープレス',         m:{deltF:1, triceps:0.5, traps:0.25} },
  { id:'sideraise',    cat:'肩', name:'サイドレイズ',            m:{deltF:1, traps:0.25} },
  { id:'frontraise',   cat:'肩', name:'フロントレイズ',           m:{deltF:1} },
  { id:'rearraise',    cat:'肩', name:'リアレイズ',              m:{deltR:1, traps:0.5} },
  { id:'uprightrow',   cat:'肩', name:'アップライトロウ',         m:{deltF:1, traps:0.5, biceps:0.25} },
  { id:'facepull',     cat:'肩', name:'フェイスプル',            m:{deltR:1, traps:0.5} },
  { id:'shrug',        cat:'肩', name:'シュラッグ',              m:{traps:1, forearm:0.25} },
  // --- 腕 ---
  { id:'bbcurl',       cat:'腕', name:'バーベルカール',           m:{biceps:1, forearm:0.25} },
  { id:'dbcurl',       cat:'腕', name:'ダンベルカール',           m:{biceps:1, forearm:0.25} },
  { id:'hammercurl',   cat:'腕', name:'ハンマーカール',           m:{biceps:1, forearm:0.5} },
  { id:'pressdown',    cat:'腕', name:'プレスダウン',            m:{triceps:1} },
  { id:'skullcrusher', cat:'腕', name:'ライイングエクステンション', m:{triceps:1} },
  { id:'kickback',     cat:'腕', name:'キックバック',            m:{triceps:1} },
  { id:'wristcurl',    cat:'腕', name:'リストカール',            m:{forearm:1} },
  // --- 脚 ---
  { id:'squat',        cat:'脚', name:'スクワット',              m:{quads:1, glutes:0.75, hams:0.5, adductor:0.5, lowback:0.25, abs:0.25} },
  { id:'frontsquat',   cat:'脚', name:'フロントスクワット',       m:{quads:1, glutes:0.5, abs:0.5, adductor:0.5, lowback:0.25, hams:0.25} },
  { id:'legpress',     cat:'脚', name:'レッグプレス',            m:{quads:1, glutes:0.5, hams:0.25, adductor:0.25} },
  { id:'lunge',        cat:'脚', name:'ランジ',                 m:{quads:1, glutes:0.75, hams:0.5, adductor:0.25} },
  { id:'bulgarian',    cat:'脚', name:'ブルガリアンスクワット',    m:{quads:1, glutes:1, hams:0.5, adductor:0.25} },
  { id:'legext',       cat:'脚', name:'レッグエクステンション',    m:{quads:1} },
  { id:'legcurl',      cat:'脚', name:'レッグカール',            m:{hams:1} },
  { id:'rdl',          cat:'脚', name:'ルーマニアンデッドリフト',  m:{hams:1, glutes:0.75, lowback:0.5, forearm:0.25} },
  { id:'hipthrust',    cat:'脚', name:'ヒップスラスト',           m:{glutes:1, hams:0.5, quads:0.25} },
  { id:'thruster',     cat:'脚', name:'スラスター',              m:{quads:1, deltF:0.75, glutes:0.75, triceps:0.5, hams:0.5, abs:0.25, lowback:0.25, adductor:0.25} },
  /* コンビネーション種目: 1セット=フロントスクワット→スラスターを続けて各(入力回数)回。
     combo:2 は「1セットで2動作ぶんの仕事量」の意味で、総重量の計算に使う。

    m:{quads:1, glutes:0.75, deltF:0.75, hams:0.5, triceps:0.5, abs:0.5, adductor:0.5, lowback:0.25} },

/* 標準処方の目安データ
   bw: 10回×3セットこなせる重量の体重比 [初心者, 中級, 上級] (一般的なストレングス基準を10RM相当に換算した概算)
   reps: 自重種目の目安回数 [初心者, 中級, 上級] (plankは秒)
   ph: ダンベル系=片手あたりの重量 */
const STD_RX = {
  benchpress:  { bw:[0.50,0.75,1.00] },
  inclinepress:{ bw:[0.40,0.60,0.85] },
  dbpress:     { bw:[0.15,0.25,0.35], ph:true },

/* ================= 状態・永続化 ================= */
const STORE_KEY = 'kintore-v1';
let memoryStore = null;
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { /* localStorage不可の環境 */ }
  return memoryStore || { logs: [], customExercises: [], favorites: [], settings: { targetSets: 10 } };
}
function saveState() {
  memoryStore = state;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
let state = loadState();
if (!state.settings) state.settings = { targetSets: 10 };
if (!state.customExercises) state.customExercises = [];
if (!state.favorites) state.favorites = [];
// スピンバイクHIITは種目DBから廃止 → 過去の記録・お気に入りも掃除
if (state.logs) state.logs = state.logs.filter(l => l.exId !== 'spinbike44');
state.favorites = state.favorites.filter(id => id !== 'spinbike44');
if (!state.settings.muscleTargets) state.settings.muscleTargets = {};
if (!state.routines) state.routines = [];
if (!state.sessions) state.sessions = {}; // 'YYYY-MM-DD' -> セッション開始時刻(その日最初に「トレーニングを追加」を押した時刻)

function allExercises() { return EXERCISES.concat(state.customExercises); }
function exById(id) { return allExercises().find(e => e.id === id); }

/* ================= 日付ユーティリティ ================= */
function fmtDate(d) { // Date -> 'YYYY-MM-DD' (ローカル)
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function today() { return fmtDate(new Date()); }
function mondayOf(dateStr) { // その週の月曜
  const d = parseDate(dateStr);
  const dow = (d.getDay()+6)%7; // 月=0
  d.setDate(d.getDate()-dow);
  return fmtDate(d);
}
function addDays(dateStr, n) { const d=parseDate(dateStr); d.setDate(d.getDate()+n); return fmtDate(d); }
function jpDate(s) { const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`; }

/* ================= 集計 ================= */
/* 達成率にカウントする「ワークセット数」。
   同じ日の同じ種目で、最高重量の60%未満のセットはウォームアップとみなして除外する。
   自重種目(全セットw=0)は判定できないため全セットをカウント。 */
function workSetCount(log) {
  const topW = log.sets.reduce((a,s)=>Math.max(a, +s.w||0), 0);
  return log.sets.filter(s => {
    // 余力5回以上(RPE5以下)と自己申告したセットは、筋肥大刺激として弱いため達成率に数えない
    if (s.rir != null && +s.rir >= 5) return false;
    // ウォームアップ判定(自重種目は対象外)
    if (topW > 0 && (+s.w||0) < topW * 0.6) return false;
    return true;
  }).length;
}

/* 週間の筋肉別スコア: { muscleId: { sets, vol, contribs: [{exId, sets, ref, vol, coef}] } }
   sets = 達成率にカウントする換算セット(主働×1.0/協働×0.5〜0.75のみ、ウォームアップ除外)。
   研究のセット数の数え方(主働+協働のハードセット)に合わせ、補助(×0.25)は含めない。
   ref = 補助も含めた参考値(部位詳細シートの参考表示に使用)。 */
function weekStats(monday) {
  const end = addDays(monday, 7);
  const res = {};
  for (const m of MUSCLES) res[m.id] = { sets:0, vol:0, contribs:{} };
  for (const log of state.logs) {
    if (log.date < monday || log.date >= end) continue;
    const ex = exById(log.exId);
    if (!ex) continue;
    const nWork = workSetCount(log);
    const tonnage = log.sets.reduce((a,s)=>a + (s.w||0)*(s.r||0), 0) * (ex.combo || 1);
    for (const [mid, coef] of Object.entries(ex.m)) {
      if (!res[mid]) continue;
      const counted = coef >= 0.5 ? nWork * coef : 0;
      res[mid].sets += counted;
      res[mid].vol  += tonnage * coef;
      if (!res[mid].contribs[ex.id]) res[mid].contribs[ex.id] = { exId: ex.id, sets:0, ref:0, vol:0, coef };
      res[mid].contribs[ex.id].sets += counted;
      res[mid].contribs[ex.id].ref  += nWork * coef;
      res[mid].contribs[ex.id].vol  += tonnage * coef;
    }
  }
  return res;
}
// 直近にその種目をやった記録
function lastLogOf(exId, beforeDate) {
  const logs = state.logs.filter(l => l.exId === exId && (!beforeDate || l.date <= beforeDate));
  if (!logs.length) return null;
  logs.sort((a,b) => a.date < b.date ? 1 : -1);
  return logs[0];
}
function heatColor(ratio) { // ratio = 換算セット数 / 目標
  if (ratio <= 0) return 'var(--heat-0)';
  if (ratio < 0.2) return 'var(--heat-1)';
  if (ratio < 0.4) return 'var(--heat-2)';
  if (ratio < 0.6) return 'var(--heat-3)';
  if (ratio < 0.8) return 'var(--heat-4)';
  if (ratio < 1.0) return 'var(--heat-5)';
  return 'var(--heat-6)';
}
function fmtNum(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }

/* 部位別の目標係数: その部位の週目標 = 基準セット数 × 係数 (4〜22に丸め)
   根拠(筋肥大ガイドラインの相場観, RPのMEV/MAV等):
   ・体積が大きく高ボリュームに耐え、直接刺激が必要な部位(四頭・広背・胸・ハム)は多め
   ・コンパウンド種目で間接的にボリュームが稼がれやすい部位(臀部・起立筋・内転筋・前腕・僧帽)は
     直接セットの必要量が少なめ
   ・起立筋は回復コストも高いため低め */
const MUSCLE_REL = {
  quads: 1.3, lats: 1.3, chest: 1.2, hams: 1.1,
  deltF: 1.0, biceps: 1.0, triceps: 1.0,
  deltR: 0.9, calves: 0.9, abs: 0.9, glutes: 0.9, traps: 0.8,
  oblique: 0.6, lowback: 0.6, adductor: 0.6, forearm: 0.6,
};
// 部位ごとの目標(優先部位の個別値があればそれを、なければ基準値×部位係数)
function targetFor(mid) {
  const mt = state.settings.muscleTargets;
  if (mt && mt[mid]) return mt[mid];
  const rel = MUSCLE_REL[mid] != null ? MUSCLE_REL[mid] : 1;
  return Math.max(4, Math.min(22, Math.round(state.settings.targetSets * rel)));
}

/* 目標の自動計算(ヒューリスティック):
   トレ歴で基準(初心者10/中級13/上級16) → 目的で係数(維持0.6/筋肥大1.0/増量1.2)
   → 年齢で回復力補正(40代-10%/50代-20%/60代以上-30%) → 週トレ日数×5を上限
   → 6〜20セットに丸め。優先部位は+25%(上限22)。 */
function calcTargetFromProfile(p) {
  const baseByExp = { b: 10, i: 13, a: 16 };
  let t = baseByExp[p.exp] || 10;
  const goalMul = { maintain: 0.6, hyper: 1.0, bulk: 1.2 };
  t *= (goalMul[p.goal] != null ? goalMul[p.goal] : 1);
  const age = +p.age || 0;
  if (age >= 60) t *= 0.7; else if (age >= 50) t *= 0.8; else if (age >= 40) t *= 0.9;
  t = Math.min(t, (+p.days || 3) * 5);
  return Math.max(6, Math.min(20, Math.round(t)));
}

/* ---------- 今週のおすすめ種目 ----------
   マップと同じ週間換算セットを部位ごとに集計し、目標に足りない部位(不足率)を採点。
   種目スコア = Σ(係数 × その部位の不足率)、主働筋(係数1.0)は×1.5ボーナス。
   → 複数の不足部位を一度に埋められるコンパウンド種目ほど上位に来る。
   同じ主働筋の種目は1つまでにして、おすすめが偏らないようにする。 */
function recommendExercises(n = 3) {
  const stats = weekStats(mondayOf(today()));
  const def = {};
  let anyLack = false;
  for (const m of MUSCLES) {
    const t = targetFor(m.id);
    const done = stats[m.id] ? stats[m.id].sets : 0;
    const lack = Math.max(0, t - done);
    def[m.id] = { lack, ratio: t > 0 ? lack / t : 0 };
    if (lack >= 0.5) anyLack = true;
  }
  if (!anyLack) return [];
  const scored = [];
  for (const e of allExercises()) {
    if (e.time) continue;
    let score = 0;
    const hits = [];
    for (const [mid, coef] of Object.entries(e.m)) {
      if (coef < 0.5) continue; // 補助×0.25は達成率に入らないので採点からも除外
      const d = def[mid];
      if (!d || d.lack < 0.5) continue;
      score += coef * d.ratio * (coef === 1 ? 1.5 : 1);
      hits.push({ mid, coef, lack: d.lack });
    }
    if (score <= 0) continue;
    hits.sort((a, b) => b.coef * b.lack - a.coef * a.lack);
    const reason = hits.slice(0, 3).map(h => `${MUSCLE_BY_ID[h.mid].short} あと${fmtNum(Math.round(h.lack * 10) / 10)}`).join('・');
    scored.push({ e, score, reason });
  }
  scored.sort((a, b) => b.score - a.score);
  const seen = new Set(), out = [];
  for (const s of scored) {
    const prim = Object.entries(s.e.m).find(([, c]) => c === 1);
    const key = prim ? prim[0] : s.e.id;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(s);
    if (out.length >= n) break;
  }
  return out;
}

/* ---------- 種目の分類(追い込み区分・レップレンジ・推奨インターバル) ----------
   ミニマル筋肥大プログラムの知見:
   ・高疲労コンパウンド(スクワット/デッド/RDL/レッグプレス等)は余力1〜2回(RPE8〜9)で止める
   ・安全なマシン/ケーブル/アイソレーションは最終セット余力0(RPE10)までOK
   ・インターバル: 下半身高重量2〜5分 / 上半身メイン2〜3分 / マシン1.5〜3分 / アイソ1〜2分 */
const EX_CLASS = {
  high: ['squat','frontsquat','deadlift','rdl','legpress','bentrow','thruster','bulgarian','lunge','fsq_thruster'],
  safe: ['sideraise','frontraise','rearraise','facepull','shrug','bbcurl','dbcurl','hammercurl',
         'pressdown','skullcrusher','kickback','wristcurl','legext','legcurl','calfraise','adduction',
         'cablecross','dbfly','chestpress','latpulldown','seatedrow','backext','crunch','legraise',
         'plank','russiantwist','sidebend','abroller'],
};
function exClass(ex) {
  if (!ex) return 'mid';
  if (EX_CLASS.high.includes(ex.id)) return 'high';
  if (EX_CLASS.safe.includes(ex.id)) return 'safe';
  return 'mid';
}
// 種目ごとの目標レップレンジ(ダブルプログレッション用)
function repRange(ex) {
  if (ex.id === 'fsq_thruster') return [8,15]; // 5kg刻みのジャンプを回数の幅で吸収する
  if (['calfraise','crunch','legraise','russiantwist','sidebend','abroller','plank'].includes(ex.id)) return [12,20];
  const c = exClass(ex);
  if (c === 'high') return [6,10];
  if (c === 'safe') return [10,15];
  return [8,12];
}
// 種目ごとの推奨インターバル(秒)
function exRest(ex) {
  const c = exClass(ex);
  if (c === 'high') return 180;
  if (c === 'safe') {
    const mainMuscles = Object.values(ex.m || {}).filter(v => v >= 0.5).length;
    return mainMuscles <= 1 ? 60 : 90; // アイソレーション1分 / マシンコンパウンド1.5分
  }
  return 120; // 上半身メイン種目など
}
// メイン重量からウォームアップの段階重量を計算
function warmupHTML(ex, sets) {
  if (!ex || ex.time) return '';
  const main = Math.max(0, ...sets.map(s => +s.w || 0));
  if (main < 20) return '';
  const st = exStep(ex);
  const r = w => Math.max(st, Math.round(w / st) * st);
  const cls = exClass(ex);
  let body;
  if (cls === 'safe') {
    body = `<div class="lr-sets">${r(main*0.5)}kg × 8回 (1〜2セット)</div>
      <div class="muted" style="margin-top:4px;font-size:11px;">マシン・アイソレーション系は軽い準備1〜2セットで十分。疲れるまでやらないこと。</div>`;
  } else {
    const steps = [
      'バーまたは超軽量 × 8〜10回',
      `${r(main*0.45)}kg × 5〜8回`,
      `${r(main*0.65)}kg × 3〜5回`,
      `${r(main*0.8)}kg × 1〜3回`,
    ];
    if (main >= 80) steps.push(`${r(main*0.9)}kg × 1回`);
    body = steps.map(s=>`<div class="lr-sets">${s}</div>`).join('') +
      `<div class="muted" style="margin-top:4px;font-size:11px;">段階的に温めて、疲れる前にメインセットへ。ウォームアップは記録不要です(達成率にも数えません)。</div>`;
  }
  return `<details class="lastrec" style="margin-top:8px;">
    <summary style="cursor:pointer;font-weight:700;font-size:13px;">🔥 ウォームアップ目安(メイン ${main}kg 想定)</summary>
    <div style="margin-top:6px;">${body}</div>
  </details>`;
}

  return `<div class="card" style="margin-top:12px;">
    <h2 style="font-size:15px;margin-top:0;">📖 フォームガイド</h2>
    <div class="fg-wrap">${g.svg}</div>
    <div style="margin-top:8px;">${g.cues.map((c,i)=>`<div class="fg-cue"><b>${i+1}.</b> ${c}</div>`).join('')}</div>
    <div class="fg-feel">🔴 = 効き(力・伸び)を感じているべき場所: ${g.feel}</div>
  </div>`;
}

/* ---------- 標準的な実施重量・回数の提案 ----------
   優先順: ①その種目の履歴があれば推定1RMの80%(=10RM相当) ②自重種目はトレ歴別の標準回数
   ③体重×トレ歴の標準比(STD_RX) ④どれも無ければ一般則のみ。回数は筋肥大の基本レンジから10回。 */
function roundLoad(w, step = 2.5) { return Math.max(step, Math.round(w / step) * step); } // 器具の刻みに丸める
function suggestPrescription(ex) {
  if (!ex || ex.time) return null;
  const st = exStep(ex);
  const p = state.settings.profile || {};
  const nSets = p.goal === 'maintain' ? 2 : 3;
  let best = 0;
  for (const l of state.logs) {
    if (l.exId !== ex.id) continue;
    for (const s of l.sets) { const v = rm1(+s.w, +s.r); if (v && v > best) best = v; }
  }
  if (best > 0) return { w: roundLoad(best / 1.25, st), r: 10, sets: nSets, src: '推定1RMの80%' };
  const rx = STD_RX[ex.id];
  const lvl = { b: 0, i: 1, a: 2 }[p.exp] != null ? { b: 0, i: 1, a: 2 }[p.exp] : 0;
  if (rx && rx.reps) return { w: 0, r: rx.reps[lvl], sets: nSets, src: 'トレ歴の標準' };
  if (rx && rx.bw && +p.bw > 0) return { w: roundLoad(p.bw * rx.bw[lvl], st), r: 10, sets: nSets, ph: !!rx.ph, src: '体重×トレ歴の標準' };
  return { w: null, r: 10, sets: nSets, src: null };
}

/* ---------- RM(推定1RM: O'Conner式) ---------- */
function rm1(w, r) { return (w > 0 && r > 0) ? w * (1 + r/40) : null; }
function fmtRM(v) {
  if (v == null) return '-';
  const x = Math.round(v * 100) / 100;
  return Number.isInteger(x) ? x.toFixed(1) : String(x);
}
function tonnageOf(log) {
  const ex = exById(log.exId);
  if (ex && ex.time) return 0; // 有酸素は負荷量(kg)に含めない
  return log.sets.reduce((a,s)=>a+(s.w||0)*(s.r||0), 0) * (ex && ex.combo ? ex.combo : 1);
}
function volInRange(from, toExcl) { // 'YYYY-MM-DD'区間の総負荷量(kg)
  return state.logs.reduce((a,l)=> (l.date >= from && l.date < toExcl) ? a + tonnageOf(l) : a, 0);
}

/* ---------- 自己ベスト(PR) ----------
   保存データからその都度時系列で再計算するので、過去の記録を修正・削除しても常に正しい。
   加重種目: 推定1RM(単セット) と セッション総重量。自重種目: 最多レップ(単セット) と セッション合計レップ。 */
const PR_KINDS = { rm1:'推定1RM', vol:'セッション総重量', reps:'最多レップ(1セット)', repsTotal:'セッション合計レップ' };
function prValueFmt(kind, v) {
  return kind==='rm1' ? fmtRM(v)+'kg' : kind==='vol' ? Math.round(v).toLocaleString()+'kg' : v+'回';
}
function prTimeline() {
  const logs = state.logs.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const best = {}; const events = [];
  for (const l of logs) {
    const ex = exById(l.exId);
    if (!ex || ex.time) continue;
    const b = best[l.exId] || (best[l.exId] = {});
    const push = (kind, value) => {
      if (value > 0 && b[kind] != null && value > b[kind]) events.push({ logId:l.id, date:l.date, exId:l.exId, kind, value, prev:b[kind] });
      if (value > 0 && (b[kind] == null || value > b[kind])) b[kind] = value;
    };
    const weighted = l.sets.some(s => +s.w > 0);
    if (weighted) {
      push('rm1', Math.max(...l.sets.map(s=>rm1(+s.w,+s.r)||0)));
      push('vol', l.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0) * (ex.combo || 1));
    } else {
      push('reps', Math.max(...l.sets.map(s=>+s.r||0)));
      push('repsTotal', l.sets.reduce((a,s)=>a+(+s.r||0),0));
    }
  }
  return { events, best };
}
function showPRCelebration(exName, evts) {
  const old = $('#prOverlay'); if (old) old.remove();

    <button class="primary prclose">やったー 💪</button>

  document.body.appendChild(div);

  for (let i=0;i<26;i++) {

/* ---------- 種目の推移グラフ ----------
   セッションごとの推定1RMと総重量を別々の小チャートで表示(単位が違うので1つの軸に載せない)。
   直近15セッションまで。点をタップすると日付と値をトースト表示。 */
function sessionSeries(exId) {
  const logs = state.logs.filter(l=>l.exId===exId).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const cmb = (exById(exId) || {}).combo || 1;
  const out = [];
  for (const l of logs) {
    const weighted = l.sets.some(s=>+s.w>0);
    if (weighted) {
      out.push({ date:l.date, rm: Math.max(...l.sets.map(s=>rm1(+s.w,+s.r)||0)), vol: l.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0) * cmb });
    } else {
      out.push({ date:l.date, reps: Math.max(...l.sets.map(s=>+s.r||0)), repsTotal: l.sets.reduce((a,s)=>a+(+s.r||0),0) });
    }
  }
  return out.slice(-15);
}
function miniChart(title, pts, unit) {
  // pts: [{date, v}] 2点以上
  const W=320, H=110, L=10, R=14, T=26, B=20;
  const vmin = Math.min(...pts.map(p=>p.v)), vmax = Math.max(...pts.map(p=>p.v));
  const span = (vmax - vmin) || 1;
  const x = i => L + (W-L-R) * (pts.length===1 ? 0.5 : i/(pts.length-1));
  const y = v => T + (H-T-B) * (1 - (v - vmin - (span===1&&vmax===vmin?0:0)) / span);
  const yv = v => vmax===vmin ? (T+(H-T-B)/2) : y(v);
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${yv(p.v).toFixed(1)}`).join('');
  const grid = [0.25,0.5,0.75].map(f=>{const gy=T+(H-T-B)*f;return `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;}).join('');
  const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yv(p.v).toFixed(1)}" r="${i===pts.length-1?4.5:3.5}" fill="var(--accent)" stroke="var(--surface-1)" stroke-width="1.5" class="chartdot" data-d="${p.date}" data-v="${p.label}"/>`).join('');
  const lastLabel = `<text x="${Math.min(x(pts.length-1), W-R-4).toFixed(1)}" y="${Math.max(yv(pts[pts.length-1].v)-9, 10).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--text-primary)">${pts[pts.length-1].label}</text>`;
  const axis = `<text x="${L}" y="${H-4}" font-size="9.5" fill="var(--text-muted)">${jpDate(pts[0].date)}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="9.5" fill="var(--text-muted)">${jpDate(pts[pts.length-1].date)}</text>`;
  return `<div style="margin-top:6px;">
    <div class="muted" style="font-size:11.5px;font-weight:650;">${title}<span style="float:right;font-weight:400;">最高 ${vmax===vmin?pts[0].label:pts.find(p=>p.v===vmax).label}${unit?'':''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" role="img" aria-label="${title}の推移">
      ${grid}
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${lastLabel}${axis}
    </svg>
  </div>`;
}
/* ---------- 停滞検知 ----------
   直近4セッションで、それ以前のベスト推定1RM(自重種目は最多レップ)を一度も更新していなければ停滞気味。
   6セッション未満の種目には表示しない。対処の優先順位はミニマル筋肥大プログラムに準拠:
   ①フォーム・睡眠・栄養の確認 → ②デロード → ③同じ筋肉を狙う別種目へ変更 */
function stagnationInfo(exId) {
  const ss = sessionSeries(exId);
  if (ss.length < 6) return null;
  const metric = p => p.rm != null ? p.rm : (p.reps != null ? p.reps : 0);
  const recent = ss.slice(-4);
  const before = ss.slice(0, -4);
  const beforeBest = Math.max(...before.map(metric));
  const recentBest = Math.max(...recent.map(metric));
  if (beforeBest > 0 && recentBest <= beforeBest) {
    return { beforeBest, recentBest, isBW: recent[recent.length-1].rm == null };
  }
  return null;
}
function stagnationHTML(ex) {
  const st = stagnationInfo(ex.id);
  if (!st) return '';
  const bestStr = st.isBW ? `${st.beforeBest}回` : `${fmtRM(st.beforeBest)}kg`;
  const primEntry = Object.entries(ex.m || {}).find(([,c]) => c === 1);
  const alts = primEntry
    ? allExercises().filter(e => e.id !== ex.id && !e.time && e.m[primEntry[0]] === 1).slice(0,3).map(e=>e.name).join('・')
    : '';
  return `<div class="card" style="margin-top:12px;border:1.5px solid var(--star);">
    <div style="font-weight:800;font-size:14px;">⚠️ 停滞気味かも</div>
    <div class="secondary" style="font-size:12.5px;margin-top:6px;line-height:1.75;">
      直近4セッション、この種目の${st.isBW ? '最多レップ' : '推定1RM'}のベスト(${bestStr})を更新できていません。<br>
      <b>チェック順:</b><br>
      ① 睡眠・栄養(タンパク質)・フォームや可動域が崩れていないか確認<br>
      ② 疲労が溜まっていそうなら今日は「🌙 控えめ」でデロード(疲労を抜くと再び伸びることが多い)<br>
      ③ それでも数週間停滞するなら、同じ筋肉を狙う別種目への変更を検討${alts ? `(候補: ${alts})` : ''}
    </div>
  </div>`;
}

function progressChartsHTML(exId) {
  const ss = sessionSeries(exId);
  if (ss.length < 2) return '';
  const weighted = ss.some(p=>p.rm != null);
  let charts;
  if (weighted) {
    const rmPts = ss.filter(p=>p.rm>0).map(p=>({date:p.date, v:p.rm, label:fmtRM(p.rm)+'kg'}));
    const volPts = ss.filter(p=>p.vol>0).map(p=>({date:p.date, v:p.vol, label:Math.round(p.vol).toLocaleString()+'kg'}));
    charts = (rmPts.length>1?miniChart('推定1RM', rmPts,'kg'):'') + (volPts.length>1?miniChart('セッション総重量', volPts,'kg'):'');
  } else {
    const rPts = ss.filter(p=>p.reps>0).map(p=>({date:p.date, v:p.reps, label:p.reps+'回'}));
    const tPts = ss.filter(p=>p.repsTotal>0).map(p=>({date:p.date, v:p.repsTotal, label:p.repsTotal+'回'}));
    charts = (rPts.length>1?miniChart('最多レップ(1セット)', rPts,'回'):'') + (tPts.length>1?miniChart('セッション合計レップ', tPts,'回'):'');
  }
  if (!charts) return '';
  return `<div class="card" style="margin-top:12px;">
    <h2 style="font-size:15px;margin-top:0;">推移(直近${ss.length}回)</h2>
    ${charts}
    <div class="muted" style="margin-top:4px;font-size:10.5px;">点をタップすると日付と値を表示。右肩上がりなら漸進性過負荷が機能しています。</div>
  </div>`;
}

  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_) {}
    ta.remove(); return ok;
  }
}
function fmtLogText(l) {
  const ex = exById(l.exId);
  const name = ex ? ex.name : l.exId;
  const lines = l.sets.map((s,i)=>`  ${i+1}セット目: ${s.w>0 ? s.w+'kg' : '自重'} × ${s.r}回${s.rir != null ? ` (余力${s.rir}回)` : ''}${s.m ? ' メモ:'+s.m : ''}`);
  const ton = tonnageOf(l);
  const best = Math.max(...l.sets.map(s=>rm1(+s.w,+s.r)||0));
  const extra = [];
  if (ton > 0) extra.push(`種目内総重量 ${Math.round(ton).toLocaleString()}kg`);
  if (best > 0) extra.push(`推定1RM ${fmtRM(best)}kg`);
  const comboNote = (ex && ex.combo) ? `\n  ※コンビネーション種目: 1セットで${ex.combo}動作を連続実施(表記回数は各動作の回数。総重量は${ex.combo}動作ぶんを含む)` : '';
  return `■ ${name}${ex?`(${ex.cat})`:''}\n${lines.join('\n')}${extra.length?`\n  ${extra.join(' / ')}`:''}${comboNote}`;
}
// dates(YYYY-MM-DD配列)の記録をGemini等に貼り付けやすいテキストにする
function exportText(dates) {
  const dset = new Set(dates);
  const byDate = {};
  for (const l of state.logs) if (dset.has(l.date)) (byDate[l.date] = byDate[l.date] || []).push(l);
  const ds = Object.keys(byDate).sort();
  if (!ds.length) return null;
  const prEv = prTimeline().events;
  const parts = ds.map(d => {
    const logs = byDate[d];
    const vol = logs.reduce((a,l)=>a+tonnageOf(l),0);
    const prs = prEv.filter(e=>e.date===d);
    // トレーニング時間の自動推定
    // 開始 = その日最初に「本日のトレーニングを追加」を押した時刻(なければ最初の種目の保存時刻で代用)
    // 終了 = 最後の種目の保存時刻
    const tss = logs.map(l=>l.ts).filter(Boolean);
    const sess = state.sessions ? state.sessions[d] : null;
    let timeLine = '';
    if (sess || tss.length) {
      const stMs = sess || (tss.length ? Math.min(...tss) : null);
      const enMs = tss.length ? Math.max(...tss) : null;
      const f = ms => { const x = new Date(ms); return `${x.getHours()}:${String(x.getMinutes()).padStart(2,'0')}`; };
      if (stMs && enMs && enMs - stMs >= 5 * 60000) {
        const durMin = Math.round((enMs - stMs) / 60000);
        timeLine = `\nトレーニング時間(推定): ${f(stMs)}〜${f(enMs)}(約${durMin}分)${sess ? '' : ' ※開始は最初の種目の記録時刻で代用した概算'}`;
      } else if (enMs) {
        timeLine = `\n記録時刻: ${f(enMs)}頃`;
      }
    }
    return `【${d.replace(/-/g,'/')}(${'日月火水木金土'[parseDate(d).getDay()]})】\n` +
      logs.map(fmtLogText).join('\n') +
      `\n日合計: ${logs.length}種目 / ${logs.reduce((a,l)=>a+l.sets.length,0)}セット / 総重量 ${Math.round(vol).toLocaleString()}kg` +
      timeLine +
      (prs.length ? `\n🏆 自己ベスト更新: ${prs.map(e=>{const ex=exById(e.exId);return `${ex?ex.name:e.exId} ${PR_KINDS[e.kind]} ${prValueFmt(e.kind,e.value)}`;}).join('、')}` : '');
  });
  const p = state.settings.profile || {};
  const prof = [
    p.age ? `${p.age}歳` : null,
    p.bw ? `体重${p.bw}kg` : null,
    p.exp ? ({b:'トレ歴1年未満',i:'トレ歴1〜3年',a:'トレ歴3年以上'})[p.exp] : null,
    p.goal ? ({maintain:'目的:維持',hyper:'目的:筋肥大',bulk:'目的:増量'})[p.goal] : null,
    p.days ? `週${p.days}日目標` : null,
  ].filter(Boolean).join('・');
  return `以下は筋トレ記録アプリからエクスポートしたトレーニングデータです(${ds.length}日分)。\n` +
    `「余力n回」= そのセット終了時にあと何回挙げられたかの自己申告(RIR)。\n` +
    (prof ? `プロフィール: ${prof}\n` : '') +
    `\n${parts.join('\n\n')}\n\n※「自重」= 加重なしの自体重種目。推定1RMはEpley式による換算値。トレーニング時間は「トレーニング開始ボタンを押した時刻〜最後の種目を記録した時刻」からアプリが自動推定した値です。追加の質問は不要です。\n体重・筋肉量・体脂肪率の推移はInBodyアプリで別途管理しています。体組成を踏まえた分析が必要な場合は、質問する代わりに「InBodyの推移データ(スクリーンショット等)を貼ってください」と依頼してください。`;
}
async function shareDates(dates, label) {
  const text = exportText(dates);
  if (!text) { toast(label + 'の記録がありません'); return; }
  const ok = await copyToClipboard(text);
  toast(ok ? `${label}の記録をコピーしました。Geminiに貼り付けてください ✨` : 'コピーに失敗しました');
}

// 1タップでバックアップ: iOSでは共有シートが開き「"ファイル"に保存」で保存先を選べる。非対応環境は通常ダウンロード
async function doBackup() {
  const json = JSON.stringify(state, null, 2);
  const fname = `kintore-backup-${today()}.json`;
  try {
    const file = new File([json], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '筋トレ記録バックアップ' });
      state.settings.lastBackup = Date.now(); saveState();
      toast('バックアップを書き出しました ✅');
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // 共有シートをキャンセル → 何もしない
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname;
  a.click(); URL.revokeObjectURL(a.href);
  state.settings.lastBackup = Date.now(); saveState();
  toast('バックアップを書き出しました ✅');
}
// 月25日以降にアプリを開いたとき、今月まだバックアップしていなければ1回だけ促す
let backupPromptShown = false;
function maybeShowBackupPrompt() {
  if (backupPromptShown || !state.logs.length) return;
  const t = today();
  if (+t.slice(8,10) < 25) return;                                    // 月末(25日〜)のみ
  const month = t.slice(0,7);
  if (state.settings.backupSkippedMonth === month) return;            // 今月スキップ済み
  if (Date.now() - (state.settings.lastBackup || 0) < 20*86400000) return; // 直近20日以内に済み
  backupPromptShown = true;
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `<div class="modal-card">
    <div style="font-size:17px;font-weight:800;">📦 月末バックアップの時間です</div>
    <div class="muted" style="margin-top:8px;line-height:1.7;">記録データはこの端末の中だけに保存されています。万一に備えて月1回の書き出しをおすすめします。<br>${state.settings.lastBackup ? '前回: ' + new Date(state.settings.lastBackup).toLocaleDateString('ja-JP') : 'まだ一度も書き出していません。'}</div>
    <button class="primary" id="bkNow" style="margin-top:14px;">📤 今すぐバックアップ(保存先を選ぶ)</button>
    <button class="ghost" id="bkSkip" style="width:100%;margin-top:8px;">今月はスキップ</button>
  </div>`;
  document.body.appendChild(div);
  $('#bkNow', div).addEventListener('click', async () => { div.remove(); await doBackup(); });
  $('#bkSkip', div).addEventListener('click', () => {
    state.settings.backupSkippedMonth = month; saveState(); div.remove();
    toast('来月末にまたお知らせします');
  });
}

const MONTH_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function daysInWeek(monday) {
  const end = addDays(monday, 7);
  return new Set(state.logs.filter(l=>l.date>=monday && l.date<end).map(l=>l.date)).size;
}
// 週の目標日数(プロフィールの週トレ日数、未設定なら1)を満たした連続週数
function weekStreak(goal) {
  let streak = 0;
  const thisMon = mondayOf(today());
  if (daysInWeek(thisMon) >= goal) streak++;
  let w = addDays(thisMon, -7);
  while (daysInWeek(w) >= goal) { streak++; w = addDays(w, -7); }
  return streak;
}

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = fmtDate(d);

  const thisMon = mondayOf(t);

  const lwVol = volInRange(lwMon, thisMon);

/* ---------- RM計算機 ---------- */
function openRMCalc() {
  const sheet = $('#sheet');
  sheet.innerHTML = `
    <div class="grip"></div>
    <h3>RM 計算機</h3>
    <div class="muted">重量と回数から推定1RMと各レップの目安重量を計算します</div>
    <div class="row" style="margin:12px 0;">
      <input type="number" id="rmW" inputmode="decimal" placeholder="重量" style="flex:1;min-width:0;width:0;text-align:center;">
      <span style="white-space:nowrap;">kg ×</span>
      <input type="number" id="rmR" inputmode="numeric" placeholder="回数" style="flex:1;min-width:0;width:0;text-align:center;">
      <span>回</span>
    </div>
    <div class="rmhero" id="rmOut">- <small>推定1RM</small></div>
    <table class="rmtable"><thead><tr><th>RM</th><th>重量</th><th>RM</th><th>重量</th></tr></thead><tbody id="rmRows"></tbody></table>`;
  const upd = () => {
    const w = +$('#rmW').value, r = +$('#rmR').value;
    const one = rm1(w, r);
    $('#rmOut').innerHTML = one ? `${fmtRM(one)} kg <small>推定1RM</small>` : '- <small>推定1RM</small>';
    const wAt = n => n === 1 ? one : one/(1+n/40); // 1RMは推定1RMそのもの
    let rows = '';
    for (let n = 1; n <= 10; n += 2) {
      const a = one ? fmtRM(wAt(n))+' kg' : '-';
      const b = one ? fmtRM(wAt(n+1))+' kg' : '-';
      rows += `<tr><td>${n}RM</td><td>${a}</td><td>${n+1}RM</td><td>${b}</td></tr>`;
    }
    $('#rmRows').innerHTML = rows;
  };
  sheet.oninput = upd;
  upd();
  $('#sheetBackdrop').classList.add('open');
  sheet.classList.add('open');
}

/* ---------- 日別ビュー ---------- */
function openDay(dateStr, ret) {
  dayDate = dateStr;
  if (ret) dayRet = ret;
  switchView('day');
}
function renderDay() {
  const el = $('#view-day');
  const logs = state.logs.filter(l=>l.date===dayDate);
  const nEx = logs.length;
  const nSets = logs.reduce((a,l)=>a+l.sets.length,0);
  const nReps = logs.reduce((a,l)=>{ const ex=exById(l.exId); return a + (ex&&ex.time ? 0 : l.sets.reduce((x,s)=>x+(s.r||0),0)); },0);
  const vol = logs.reduce((a,l)=>a+tonnageOf(l),0);

  el.innerHTML = `
    <div class="dayhero">
      <div class="nav">
        <button id="dayBack" aria-label="戻る">‹</button>
        <button id="dayPrev" aria-label="前日">◂</button>
        <span class="dt">${dayDate.replace(/-/g,'/')} (${'日月火水木金土'[parseDate(dayDate).getDay()]})</span>
        <button id="dayNext" aria-label="翌日">▸</button>
        <span style="width:38px;"></span>
      </div>
      <div class="dstats">
        <div class="dstat"><div class="k">合計種目数</div><div class="v">${nEx}</div></div>
        <div class="dstat"><div class="k">合計セット数</div><div class="v">${nSets}</div></div>
        <div class="dstat"><div class="k">合計レップ数</div><div class="v">${nReps}</div></div>
        <div class="dstat"><div class="k">合計負荷量</div><div class="v">${Math.round(vol).toLocaleString()}</div></div>
      </div>
    </div>
    ${logs.length ? logs.map(l => {
      const ex = exById(l.exId);
      const tm = !!(ex && ex.time);
      const isCol = collapsed.has(l.id);
      return `<div class="excard" data-log="${l.id}">
        <div class="exhd" data-toggle="${l.id}"><span>${esc(ex?ex.name:l.exId)}</span><span class="chev">${isCol?'▼':'▲'}</span></div>
        ${isCol ? '' : `<table>
          <thead><tr><th>セット</th><th>${tm?'負荷':'重さ'}</th><th>${tm?'時間':'回数'}</th><th>RM</th><th></th></tr></thead>
          <tbody>${l.sets.map((s,i)=>`
            <tr><td>${i+1}</td>
            <td class="wt">${tm ? (s.w>0?s.w:'—') : (s.w>0 ? s.w+' <span style="font-weight:400;font-size:11px;">Kg</span>' : '自重')}</td>
            <td>${s.r} <span style="font-size:11px;color:var(--text-muted);">${tm?'分':'回'}</span>${!tm&&s.rir!=null?`<span style="font-size:10px;color:var(--text-muted);"> 余力${s.rir}</span>`:''}</td>
            <td class="rmv">${!tm&&s.w>0?fmtRM(rm1(s.w,s.r))+'Kg':'-'}</td>
            <td><button class="trash" data-dellog="${l.id}" data-delset="${i}" aria-label="セット削除">🗑</button></td></tr>
            ${s.m?`<tr><td></td><td colspan="4" class="memoline">📝 ${esc(s.m)}</td></tr>`:''}`).join('')}
          </tbody></table>
          <div class="cardacts">
            <button data-addset="${l.id}">＋ セット追加</button>
            <button data-editlog="${l.id}">✎ 編集</button>
          </div>`}
      </div>`;
    }).join('') : '<div class="empty">この日の記録はありません。<br>右下の＋から追加できます。</div>'}
    ${logs.length ? '<button class="ghost" id="saveRoutine" style="width:100%;margin-top:4px;">📋 この日の種目をルーティンに保存</button>' : ''}
    <button class="fab" id="dayAdd" aria-label="種目を追加">＋</button>`;

  $('#dayBack').addEventListener('click', ()=>switchView(dayRet));

  $$('[data-toggle]', el).forEach(h => h.addEventListener('click', ()=>{

    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);

  $$('[data-delset]', el).forEach(b => b.addEventListener('click', ()=>{

    if (!log) return;
    log.sets.splice(+b.dataset.delset, 1);

  if (srBtn) srBtn.addEventListener('click', () => {

    let name = cats.slice(0,2).join('・') + 'の日';
    let n = 2;
    while (state.routines.some(r=>r.name===name)) name = cats.slice(0,2).join('・') + 'の日 ' + (n++);
    state.routines.push({ id:'r'+Date.now().toString(36), name, exIds });
    saveState();
    toast(`「${name}」として保存しました(名前は設定で変更可)`);
  });
}

/* ---------- 記録 ---------- */
let reorderMode = false;
const SORT_MODES = [['recent','最近やった順'],['name','名前順'],['cat','部位順']];

function renderRecord() {
  const el = $('#view-record');
  if (draft) { renderSetEditor(el); return; }
  const sortMode = state.settings.sortMode || 'recent';
  const filter = e =>
    (recCat === 'すべて' || e.cat === recCat) &&
    (!recSearch || e.name.toLowerCase().includes(recSearch.toLowerCase()));

  const lastDate = {};
  for (const l of state.logs) if (!lastDate[l.exId] || l.date > lastDate[l.exId]) lastDate[l.exId] = l.date;

  // お気に入り(手動順) + それ以外(選択中の並び順)
  state.favorites = state.favorites.filter(id => exById(id));
  const favSet = new Set(state.favorites);
  const favs = state.favorites.map(exById).filter(filter);
  const others = allExercises().filter(e => filter(e) && !favSet.has(e.id));
  if (sortMode === 'recent') others.sort((a,b) => (lastDate[b.id]||'') > (lastDate[a.id]||'') ? 1 : -1);
  if (sortMode === 'name') others.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  if (sortMode === 'cat') others.sort((a,b) => (CATS.indexOf(a.cat)-CATS.indexOf(b.cat)) || a.name.localeCompare(b.name,'ja'));

  const rowHTML = (e, isFav) => {
    const musc = Object.entries(e.m).sort((a,b)=>b[1]-a[1]).map(([mid])=>MUSCLE_BY_ID[mid].short).slice(0,4).join('・') || '心肺・全身';
    const last = lastDate[e.id] ? `<span class="last">${jpDate(lastDate[e.id])}</span>` : '';
    const right = (isFav && reorderMode)
      ? `<span class="draghandle" aria-label="ドラッグで並び替え">⠿</span>`
      : `<button class="starbtn ${isFav?'on':''}" data-star="${e.id}" aria-label="お気に入り">${isFav?'★':'☆'}</button>`;
    return `<div class="exrow" data-ex="${e.id}">
      <button class="exmain" data-ex="${e.id}"><span>${esc(e.name)}<br><span class="exmeta">${musc}</span></span>${last}</button>
      ${right}</div>`;
  };

  // 本日の実施済み+ルーティン+おすすめ(検索ボックスの上に出る部分)
  const buildTopHTML = () => {
    // 本日の実施済み: 今日やった種目をリスト最上部に表示(タップで編集)
    let todayHTML = '';
    const todays = state.logs.filter(l => l.date === today());
    if (todays.length && recCat === 'すべて') {
      todayHTML = `<div class="sectionhead"><span>✅ 本日の実施済み(${todays.length}種目)</span><button id="goTodayDay">詳細 ›</button></div>
      <div class="card" style="padding:2px 14px;"><div class="exlist">
        ${todays.map(l => {
          const e = exById(l.exId);
          const tm = !!(e && e.time);
          const summary = l.sets.map(s => tm ? s.r+'分' : `${s.w>0?s.w+'kg':'自重'}×${s.r}`).join('　');
          return `<div class="exrow"><button class="exmain" data-editlog="${l.id}"><span>${esc(e?e.name:l.exId)}<br><span class="exmeta">${summary}</span></span></button></div>`;
        }).join('')}
      </div></div>`;
    }
    const activeRt = recRoutine ? state.routines.find(r=>r.id===recRoutine) : null;
    if (recRoutine && !activeRt) recRoutine = null;
    const doneToday = new Set(state.logs.filter(l=>l.date===today()).map(l=>l.exId));
    let rtHTML = '';
    if (activeRt) {
      const doneN = activeRt.exIds.filter(id=>doneToday.has(id)).length;
      rtHTML = `
      <div class="sectionhead"><span>📋 ${esc(activeRt.name)}(${doneN}/${activeRt.exIds.length} 完了)</span><button id="rtQuit">終了</button></div>
      <div class="card" style="padding:2px 14px;"><div class="exlist">
        ${activeRt.exIds.map(id => {
          const e = exById(id); if (!e) return '';
          const done = doneToday.has(id);
          const musc = Object.entries(e.m).sort((a,b)=>b[1]-a[1]).map(([mid])=>MUSCLE_BY_ID[mid].short).slice(0,4).join('・');
          return `<div class="exrow" data-ex="${id}">
            <button class="exmain" data-ex="${id}"${done?' style="opacity:0.5;"':''}><span>${done?'✅':'⬜'} ${esc(e.name)}<br><span class="exmeta">${musc}</span></span></button>
          </div>`;
        }).join('')}
      </div></div>`;
    } else if (state.routines.length && recCat === 'すべて') {
      rtHTML = `<div class="sectionhead"><span>📋 ルーティン</span></div>
      <div class="chips">${state.routines.map(r=>`<button data-rt="${r.id}">${esc(r.name)}</button>`).join('')}</div>`;
    }
    const recs = (recCat === 'すべて' && !activeRt) ? recommendExercises(3) : [];
    const recHTML = recs.length ? `
      <div class="sectionhead"><span>💡 今週のおすすめ(マップの不足部位から)</span></div>
      <div class="card" style="padding:2px 14px;"><div class="exlist">
        ${recs.map(r=>`<div class="exrow" data-ex="${r.e.id}">
          <button class="exmain" data-ex="${r.e.id}"><span>${esc(r.e.name)}<br><span class="exmeta">不足: ${r.reason}セット</span></span></button>
        </div>`).join('')}
      </div></div>` : '';
    return todayHTML + rtHTML + recHTML;
  };

  // 種目リスト(検索ボックスの下に出る部分)
  const buildListHTML = () => {
    const favSet = new Set(state.favorites);
    const favs = state.favorites.map(exById).filter(Boolean).filter(filter);
    const others = allExercises().filter(e => filter(e) && !favSet.has(e.id));
    if (sortMode === 'recent') others.sort((a,b) => (lastDate[b.id]||'') > (lastDate[a.id]||'') ? 1 : -1);
    if (sortMode === 'name') others.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
    if (sortMode === 'cat') others.sort((a,b) => (CATS.indexOf(a.cat)-CATS.indexOf(b.cat)) || a.name.localeCompare(b.name,'ja'));
    return `
    ${favs.length ? `<div class="sectionhead"><span>★ お気に入り</span>
      ${state.favorites.length>1 ? `<button id="reorderBtn">${reorderMode?'完了':'並び替え'}</button>` : ''}</div>
    <div class="card" style="padding:2px 14px;"><div class="exlist" id="favList">${favs.map(e=>rowHTML(e,true)).join('')}</div></div>` : ''}
    ${favs.length ? '<div class="sectionhead"><span>すべての種目</span></div>' : ''}
    <div class="card" style="padding:2px 14px;"><div class="exlist">
      ${others.map(e=>rowHTML(e,false)).join('') || '<div class="empty">該当する種目がありません</div>'}
    </div></div>`;
  };

  const cats = ['すべて', ...CATS];
  el.innerHTML = `
    <div id="topWrap" class="${recSearch ? 'collapsed' : ''}">${buildTopHTML()}</div>
    <div class="chips">${cats.map(c=>`<button data-cat="${c}" class="${c===recCat?'active':''}">${c}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:10px;">
      <input type="search" id="exSearch" placeholder="種目を検索" value="${esc(recSearch)}" style="flex:1;min-width:0;">
      <select id="sortSel" style="flex:0 0 auto;font-size:13px;padding:10px 8px;">
        ${SORT_MODES.map(([v,l])=>`<option value="${v}" ${v===sortMode?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div id="listWrap">${buildListHTML()}</div>`;

  const bindTop = () => {
    $$('#topWrap button[data-rt]', el).forEach(b => b.addEventListener('click', () => { recRoutine = b.dataset.rt; renderRecord(); }));
    const rq = $('#rtQuit', el);
    if (rq) rq.addEventListener('click', () => { recRoutine = null; renderRecord(); });
    $$('#topWrap .exmain[data-ex]', el).forEach(b => b.addEventListener('click', () => startDraft(b.dataset.ex)));
    // 本日の実施済み: タップで編集、詳細で日別ビューへ
    $$('#topWrap [data-editlog]', el).forEach(b => b.addEventListener('click', () => {
      const log = state.logs.find(l => l.id === b.dataset.editlog);
      if (log) startDraft(log.exId, log);
    }));
    const gtd = $('#goTodayDay', el);
    if (gtd) gtd.addEventListener('click', () => openDay(today(), 'record'));
  };
  const bindList = () => {
    $$('#listWrap .exmain', el).forEach(b => b.addEventListener('click', () => { if (!reorderMode) startDraft(b.dataset.ex); }));
    $$('#listWrap button[data-star]', el).forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.star;
      if (state.favorites.includes(id)) state.favorites = state.favorites.filter(f=>f!==id);
      else state.favorites.push(id);
      saveState(); renderRecord();
    }));
    const rb = $('#reorderBtn', el);
    if (rb) rb.addEventListener('click', () => { reorderMode = !reorderMode; renderRecord(); });
    const favList = $('#favList', el);
    if (favList && reorderMode) enableDragSort(favList);
  };
  bindTop(); bindList();

  // カテゴリ選択時は検索文字をクリアして、その部位の全種目を表示する
  $$('.chips button[data-cat]', el).forEach(b => b.addEventListener('click', () => { recCat = b.dataset.cat; recSearch = ''; renderRecord(); }));
  // 検索: 入力欄は作り直さず、下のリストだけを更新する(作り直すと日本語IMEの変換が確定できなくなるため)
  // 「ルーティン/今週のおすすめ」は突然消さず、上へスライドして畳む
  const si = $('#exSearch', el);
  si.addEventListener('input', () => {
    recSearch = si.value;
    const tw = $('#topWrap', el);
    const hide = !!recSearch;
    if (hide && !tw.classList.contains('collapsed')) {
      tw.style.maxHeight = tw.scrollHeight + 'px';        // 現在の高さを起点に
      requestAnimationFrame(() => tw.classList.add('collapsed'));
    } else if (!hide && tw.classList.contains('collapsed')) {
      tw.innerHTML = buildTopHTML(); bindTop();           // 中身を作り直してから展開
      tw.classList.remove('collapsed');
      tw.style.maxHeight = tw.scrollHeight + 'px';
      setTimeout(() => { tw.style.maxHeight = ''; }, 400);
    }
    $('#listWrap', el).innerHTML = buildListHTML();
    bindList();
  });
  $('#sortSel', el).addEventListener('change', e => { state.settings.sortMode = e.target.value; saveState(); renderRecord(); });
}

// お気に入りのドラッグ&ドロップ並び替え(タッチ/マウス両対応)
function enableDragSort(listEl) {
  let dragRow = null;
  listEl.addEventListener('pointerdown', e => {
    const h = e.target.closest('.draghandle');
    if (!h) return;
    dragRow = h.closest('.exrow');
    dragRow.classList.add('dragging');
    try { h.setPointerCapture(e.pointerId); } catch(_) {}
    e.preventDefault();
  });
  listEl.addEventListener('pointermove', e => {
    if (!dragRow) return;
    for (const row of $$('.exrow:not(.dragging)', listEl)) {
      const r = row.getBoundingClientRect();
      if (e.clientY > r.top && e.clientY < r.bottom) {
        if (e.clientY < r.top + r.height/2) listEl.insertBefore(dragRow, row);
        else listEl.insertBefore(dragRow, row.nextSibling);
        break;
      }
    }
  });
  const end = () => {
    if (!dragRow) return;
    dragRow.classList.remove('dragging');
    dragRow = null;
    state.favorites = $$('.exrow', listEl).map(r => r.dataset.ex);
    saveState(); renderRecord();
  };
  listEl.addEventListener('pointerup', end);
  listEl.addEventListener('pointercancel', end);
}

// 汎用の確認モーダル
function confirmModal(title, desc, yesLabel, then) {
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `<div class="modal-card">
    <div style="font-size:16px;font-weight:800;">${title}</div>
    ${desc ? `<div class="muted" style="margin-top:8px;line-height:1.6;">${desc}</div>` : ''}
    <button class="primary" id="cmYes" style="margin-top:14px;">${yesLabel}</button>
    <button class="ghost" id="cmNo" style="width:100%;margin-top:8px;">キャンセル</button>
  </div>`;

  $('#cmYes', div).addEventListener('click', () => { div.remove(); then(true); });
  $('#cmNo', div).addEventListener('click', () => { div.remove(); then(false); });
}

// 回数プルダウンの選択肢: 1〜20回 + 高回数種目(カーフ・腹筋・プランク秒数など)用の粗い刻み
const REP_CHOICES = [...Array.from({length:20},(_,i)=>i+1), 25,30,35,40,45,50,60,70,80,90,100,120,150,180];
// cur=実際の入力値 / sug=グレー表示する提案値(未選択のとき先頭に表示。入力値ではない)
function repOptionsHTML(cur, sug) {
  const opts = REP_CHOICES.slice();
  const c = (cur === '' || cur == null) ? null : +cur;
  if (c != null && !opts.includes(c)) { opts.push(c); opts.sort((a,b)=>a-b); }
  return `<option value="">${(c == null && sug) ? sug : '−'}</option>` + opts.map(n=>`<option value="${n}" ${c===n?'selected':''}>${n}</option>`).join('');
}

// 「今日はまだ開始していない」状態で記録タブから種目を選んだときの確認
let sessionDeclinedFor = null; // 「今はしない」を選んだ日(この起動中は再度聞かない)
function askSessionStart(then) {
  const now = new Date();
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `<div class="modal-card">
    <div style="font-size:17px;font-weight:800;">本日のトレーニングを開始しますか?</div>
    <div class="muted" style="margin-top:8px;line-height:1.6;">「開始する」を押すと現在時刻(${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')})を開始として記録し、Gemini共有のトレーニング時間の推定に使います。</div>
    <button class="primary" id="ssYes" style="margin-top:14px;">▶ 開始する</button>
    <button class="ghost" id="ssNo" style="width:100%;margin-top:8px;">今はしない(記録だけする)</button>
  </div>`;
  document.body.appendChild(div);
  $('#ssYes', div).addEventListener('click', () => { div.remove(); then(true); });
  $('#ssNo', div).addEventListener('click', () => { div.remove(); then(false); });
}
function startDraft(exId, log=null) {
  if (!log && pickDate === today() && !state.sessions[pickDate] && sessionDeclinedFor !== pickDate) {
    askSessionStart(started => {
      if (started) { state.sessions[pickDate] = Date.now(); saveState(); toast('トレーニング開始! 🔥'); }
      else sessionDeclinedFor = pickDate;
      startDraftNow(exId, log);
    });
    return;
  }
  startDraftNow(exId, log);
}
function startDraftNow(exId, log=null) {
  const last = lastLogOf(exId, today());
  let sets, sug = null, pending = [];
  if (log) {
    sets = log.sets.map(s=>({...s})); // 既存記録の編集は実値をそのまま表示
  } else if (last) {
    // 前回の内容は「提案」: 1セット目だけ表示し、回数はグレーの提案値(入力値ではない)。残りは＋セット追加で
    const plan = last.sets.map(s=>({w:s.w, rsug:s.r}));
    sets = [{ w: plan[0].w, r:'', rir:'', rsug: plan[0].rsug }];
    pending = plan.slice(1);
  } else {
    // 履歴なし → 標準的な重量・回数を提案
    sug = suggestPrescription(exById(exId));
    if (sug && sug.w != null) {
      sets = [{ w: sug.w, r:'', rir:'', rsug: sug.r }];
      pending = Array.from({length: Math.max(0, sug.sets - 1)}, () => ({w: sug.w, rsug: sug.r}));
    } else sets = [{w:'', r:'', rir:''}];
  }
  // 保存後は種目一覧へ戻る(本日の実施済みを見ながら次の種目を選べる)
  const ret = ['day','home','history'].includes(currentView) ? currentView : 'record';
  draft = { exId, date: log ? log.date : pickDate, sets, pending, logId: log ? log.id : null, ret, sug };
  draft.snap = JSON.stringify(sets); // 初期状態のスナップショット(上書き確認の判定用)
  switchView('record');
}

/* ---------- プログレッシブ・オーバーロード ----------
   ダブルプログレッション方式(8〜12回レンジ):
   ・重量ありで前回12回以上 → 重量を1段階アップ(20kg未満:+1kg / 以上:+2.5kg)して8回に戻す
   ・それ以外(自重含む) → 回数を+1 */
/* 提示する重量はジムの器具の刻みに丸める(既定2.5kg、種目ごとにstepで上書き可。例: 5kg刻みの器具)。
   ダブルプログレッション: 同重量で回数をレンジ上限まで伸ばす → 達したら1段重くして下限に戻る */
function exStep(ex) { return (ex && ex.step) || 2.5; }
function progressSets(sets, ex) {
  const [lo, hi] = ex ? repRange(ex) : [8, 12];
  const st = exStep(ex);
  return sets.map(s => {
    const w = +s.w || 0, r = +s.r || 0;
    if (w > 0 && r >= hi) {
      const nw = Math.ceil((w + 0.01) / st) * st; // 現在より上の刻みへ
      return { w: nw, r: lo };
    }
    return { w, r: r + 1 };
  });
}
// 控えめ(体調いまいちな日): 重量は約-10%を器具の刻みに切り下げ・回数キープ、自重は回数-30%
function deloadSets(sets, ex) {
  const st = exStep(ex);
  return sets.map(s => {
    const w = +s.w || 0, r = +s.r || 0;
    if (w > 0) {
      const nw = Math.max(st, Math.floor(w * 0.9 / st) * st);
      return { w: Math.min(nw, w), r };
    }
    return { w: 0, r: Math.max(1, Math.ceil(r * 0.7)) };
  });
}

/* ---------- 休憩タイマー ---------- */
const REST_CHOICES = [30, 60, 90, 120, 150, 180];
function restChoice() { return REST_CHOICES.includes(state.settings.restSec) ? state.settings.restSec : 60; }
let restTimerId = null, restEnd = 0, audioCtx = null;
/* ---- 振動(ハプティクス) ----
   iOSのSafari/ホーム画面アプリは navigator.vibrate 非対応のため、
   iOS 18+の「<input type=checkbox switch> のトグルで触覚フィードバックが鳴る」仕様を利用して
   タップ振動を連打する(ベストエフォート)。Androidは通常のVibration APIを使用。 */
let hapticLabel = null;
function hapticTap() {
  try {
    if (!hapticLabel) {
      hapticLabel = document.createElement('label');
      hapticLabel.style.cssText = 'position:fixed;left:-99px;top:-99px;width:1px;height:1px;opacity:0;pointer-events:none;';
      const inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.setAttribute('switch', '');
      hapticLabel.appendChild(inp);
      document.body.appendChild(hapticLabel);
    }
    hapticLabel.click(); // labelクリック経由でスイッチが切り替わり、触覚が発火する
  } catch(e) {}
}
function vibrateAlert() {
  if (navigator.vibrate) { try { navigator.vibrate([250,120,250,120,500]); } catch(e) {} }
  for (let i = 0; i < 8; i++) setTimeout(hapticTap, i * 200); // iOS: タップ振動×8連打(約1.6秒)
}
// 画面フラッシュ(音・振動が効かない状況向けの視覚通知)
function flashScreen() {
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none;z-index:190;transition:opacity 0.15s;';
  document.body.appendChild(f);
  let n = 0;
  const iv = setInterval(() => {
    f.style.opacity = (n % 2 === 0) ? '0.55' : '0';
    if (++n >= 6) { clearInterval(iv); setTimeout(()=>f.remove(), 200); }
  }, 180);
}
function beepDone() {
  try {
    if (audioCtx) {
      const t0 = audioCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.35, t0 + i*0.3);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + i*0.3 + 0.22);
        o.start(t0 + i*0.3); o.stop(t0 + i*0.3 + 0.25);
      }
    }
  } catch(e) {}
  vibrateAlert();
  flashScreen();
  toast('休憩終了! 次のセットへ 💪');
}
function timerTick() {
  const left = Math.max(0, Math.ceil((restEnd - Date.now())/1000));
  const disp = $('#timerDisp');
  if (disp) disp.textContent = left > 0 ? String(left) : '0';
  const go = $('#timerGo');
  if (go) go.textContent = left > 0 ? 'STOP' : 'START';
  if (left <= 0 && restTimerId) {
    clearInterval(restTimerId); restTimerId = null;
    beepDone();
  }
}
function startRest() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
  if (restTimerId) { clearInterval(restTimerId); restTimerId = null; }
  const sec = +($('#timerSec') ? $('#timerSec').value : 0) || restChoice();
  restEnd = Date.now() + sec*1000;
  restTimerId = setInterval(timerTick, 250);
  timerTick();
}
function toggleRest() {
  if (restTimerId) { clearInterval(restTimerId); restTimerId = null; timerTick(); return; }
  const sec = +($('#timerSec') ? $('#timerSec').value : 0) || restChoice();
  state.settings.restSec = sec; saveState();
  startRest();
}

    saveState();
    const savedDate = draft.date;
    const savedExName = ex.name;
    const ret = draft.ret || 'map';
    draft = null;
    if (ret === 'day') { openDay(savedDate, dayRet); } else switchView(ret);
    // 自己ベスト更新チェック → セレブレーション
    const prs = prTimeline().events.filter(e => e.logId === savedId);
    if (prs.length) showPRCelebration(savedExName, prs);
  });
}

/* ---------- マップ ---------- */

    </div>

    </div>
    <div class="card">
      <h2>部位別 換算セット数</h2>
      <div id="muscleBars"></div>
    </div>`;

  // 色を塗る
  $$('.bodymap .muscle', el).forEach(p => {
    const s = stats[p.dataset.mid];
    p.style.fill = heatColor(s.sets / targetFor(p.dataset.mid));
    p.addEventListener('click', () => openMuscleSheet(p.dataset.mid, stats));
    p.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); openMuscleSheet(p.dataset.mid, stats); } });
  });
  $('#wPrev').addEventListener('click', ()=>{ mapMonday = addDays(mapMonday,-7); renderMap(); });
  $('#wNext').addEventListener('click', ()=>{ mapMonday = addDays(mapMonday,7); renderMap(); });

  // 部位別バー(降順)
  const rows = MUSCLES.map(m => ({ m, s: stats[m.id], tgt: targetFor(m.id) })).sort((a,b)=>b.s.sets-a.s.sets);
  const max = Math.max(...rows.map(r=>Math.max(r.s.sets, r.tgt)));
  $('#muscleBars').innerHTML = rows.map(({m,s,tgt}) => `
    <div class="contrib" data-mid="${m.id}" style="cursor:pointer;">
      <div class="top"><span>${m.name}${state.settings.muscleTargets[m.id]?' <span style="color:var(--star);">★</span>':''}</span><span class="val">${fmtNum(s.sets)} / ${tgt} セット</span></div>
