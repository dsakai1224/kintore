        <div style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100,tgt/max*100)}%;width:2px;background:var(--baseline);"></div>
      </div>
    </div>`).join('');
  $$('#muscleBars .contrib').forEach(d => d.addEventListener('click', ()=>openMuscleSheet(d.dataset.mid, stats)));
}

/* ---------- 部位詳細シート ---------- */
function openMuscleSheet(mid, stats) {
  const m = MUSCLE_BY_ID[mid];
  const s = stats[mid];
  const target = targetFor(mid);
  const contribs = Object.values(s.contribs).sort((a,b)=>(b.sets-a.sets) || (b.ref-a.ref));
  const maxSets = Math.max(...contribs.map(c=>c.sets), 0.001);
  const pct = Math.round(s.sets/target*100);
  const sheet = $('#sheet');
  sheet.innerHTML = `
    <div class="grip"></div>
    <h3>${m.name}</h3>
    <div class="muted">${jpDate(mapMonday)}週 ・ 目標 ${target} 換算セット</div>
    <div class="stats">
      <div><div class="v">${fmtNum(s.sets)}</div><div class="k">換算セット数</div></div>
      <div><div class="v">${pct}%</div><div class="k">目標達成率</div></div>
      <div><div class="v">${Math.round(s.vol).toLocaleString()}</div><div class="k">換算ボリューム(kg)</div></div>
    </div>
    <div class="contribs">
      ${contribs.length ? contribs.map(c => {
        const ex = exById(c.exId);
        const aux = c.coef < 0.5;
        const role = c.coef===1?'主働':c.coef>=0.5?'協働':'補助';
        return `<div class="contrib"${aux?' style="opacity:0.55;"':''}>
          <div class="top"><span>${esc(ex?ex.name:c.exId)}<span class="roletag">${role} ×${c.coef}</span></span>
          <span class="val">${aux ? `参考 ${fmtNum(Math.round(c.ref*10)/10)}セット(達成率外)` : `${fmtNum(c.sets)}セット`}・${Math.round(c.vol).toLocaleString()}kg</span></div>
          <div class="barwrap"><div class="bar" style="width:${(aux?c.ref:c.sets)/maxSets*100}%"></div></div>
        </div>`;
      }).join('') : '<div class="empty">この週の記録はありません</div>'}
    </div>
    ${contribs.length ? '<div class="muted" style="margin-top:8px;font-size:11px;">達成率は主働(×1.0)と協働(×0.5〜0.75)のワークセットのみでカウント。補助(×0.25)、その日の最高重量の60%未満のウォームアップセット、余力5回以上と記録した楽なセットは含めていません。</div>' : ''}
    ${MUSCLE_INFO[mid] ? `
    <div style="margin-top:16px;border-top:1px solid var(--grid);padding-top:12px;">
      <div style="font-weight:700;font-size:13.5px;">この筋肉について</div>
      <div class="secondary" style="font-size:12.5px;margin-top:4px;line-height:1.65;">${MUSCLE_INFO[mid].desc}</div>
      <div style="font-weight:700;font-size:13.5px;margin-top:12px;">有効なトレーニング</div>
      <div class="row" style="flex-wrap:wrap;margin-top:8px;">
        ${MUSCLE_INFO[mid].ex.map(id=>{ const e=exById(id); return e?`<button class="ghost" data-sheetex="${id}" style="font-size:12.5px;">${esc(e.name)} ›</button>`:''; }).join('')}
      </div>
    </div>` : ''}`;
  // おすすめ種目 → シートを閉じて記録画面へ
  $$('button[data-sheetex]', sheet).forEach(b => b.addEventListener('click', () => {
    closeSheet();
    pickDate = today();
    startDraft(b.dataset.sheetex);
  }));
  $('#sheetBackdrop').classList.add('open');
  sheet.classList.add('open');
  selectedMuscle = mid;
  $$('.bodymap .muscle').forEach(p => p.classList.toggle('selected', p.dataset.mid===mid));
}
function closeSheet() {
  $('#sheetBackdrop').classList.remove('open');
  $('#sheet').classList.remove('open');
  selectedMuscle = null;
  $$('.bodymap .muscle').forEach(p => p.classList.remove('selected'));
}
$('#sheetBackdrop').addEventListener('click', closeSheet);

/* ---------- 履歴 ---------- */
function renderHistory() {
  const el = $('#view-history');
  if (!state.logs.length) { el.innerHTML = '<div class="empty">まだ記録がありません。<br>「記録」タブから始めましょう。</div>'; return; }
  const byDate = {};
  for (const l of state.logs) (byDate[l.date] = byDate[l.date] || []).push(l);
  const dates = Object.keys(byDate).sort().reverse();

  // 自己ベスト(PR)を時系列から再計算
  const { events: prEvents, best: prBest } = prTimeline();
  const prByLog = {};
  for (const e of prEvents) (prByLog[e.logId] = prByLog[e.logId] || []).push(e);
  const recentPRs = prEvents.slice().reverse().slice(0, 6);
  const bestRows = Object.entries(prBest).map(([exId, b]) => {
    const ex = exById(exId);
    if (!ex) return '';
    const parts = [];
    if (b.rm1 != null) parts.push('1RM ' + fmtRM(b.rm1) + 'kg');
    if (b.vol != null) parts.push('総重量 ' + Math.round(b.vol).toLocaleString() + 'kg');
    if (b.reps != null) parts.push('最多 ' + b.reps + '回');
    if (b.repsTotal != null) parts.push('合計 ' + b.repsTotal + '回');
    return parts.length ? `<div class="setting-row" style="font-size:13px;"><span>${esc(ex.name)}</span><span class="muted">${parts.join(' / ')}</span></div>` : '';
  }).join('');
  const prCard = `<div class="card">
    <h2>🏆 自己ベスト</h2>
    ${recentPRs.length ? `<div class="muted" style="font-size:11px;margin-bottom:2px;">最近の更新</div>
      ${recentPRs.map(e => { const ex = exById(e.exId); return `<div class="setting-row" style="font-size:13px;"><span>${jpDate(e.date)}　${esc(ex?ex.name:e.exId)}</span><span><b>${PR_KINDS[e.kind]} ${prValueFmt(e.kind, e.value)}</b></span></div>`; }).join('')}`
      : '<div class="muted">2回目以降の記録で推定1RMや総重量のベストを更新すると、ここに表示されます。</div>'}
    ${bestRows ? `<details style="margin-top:8px;"><summary class="muted" style="cursor:pointer;font-size:12px;">現在の自己ベスト一覧</summary>${bestRows}</details>` : ''}
  </div>`;

  el.innerHTML = prCard + dates.map(d => {
    const logs = byDate[d];
    const vol = logs.reduce((a,l)=>a+tonnageOf(l),0);
    return `<div class="card daycard">
      <div class="dayhead"><button data-openday="${d}" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:650;cursor:pointer;font-family:inherit;padding:0;">${jpDate(d)} ›</button><span class="muted">${logs.length}種目 ・ ${Math.round(vol).toLocaleString()}kg</span></div>
      ${logs.map(l => {
        const ex = exById(l.exId);
        const tm = !!(ex && ex.time);
        const prMark = prByLog[l.id] ? ` <span title="${prByLog[l.id].map(e=>PR_KINDS[e.kind]+' '+prValueFmt(e.kind,e.value)).join(' / ')}">🏆</span>` : '';
        return `<div class="logrow">
          <div class="name">${esc(ex?ex.name:l.exId)}${prMark}</div>
          <div class="sets">${l.sets.map(s=>tm?`${s.r}分`:`${s.w||'自重'}${s.w?'kg':''}×${s.r}`).join('　')}</div>
          <div class="acts"><button data-edit="${l.id}">編集</button><button class="del" data-del="${l.id}">削除</button></div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  $$('button[data-openday]', el).forEach(b => b.addEventListener('click', () => openDay(b.dataset.openday, 'history')));
  $$('button[data-edit]', el).forEach(b => b.addEventListener('click', () => {
    const log = state.logs.find(l=>l.id===b.dataset.edit);
    if (log) startDraft(log.exId, log);
  }));
  $$('button[data-del]', el).forEach(b => b.addEventListener('click', () => {
    armConfirm(b, '本当に削除?', () => {
      state.logs = state.logs.filter(l=>l.id!==b.dataset.del);
      saveState(); renderHistory(); toast('削除しました');
    });
  }));
}

  $('#btnExport').addEventListener('click', doBackup);
  $('#btnImport').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!Array.isArray(data.logs)) throw new Error('bad');
        state = data;
        if (!state.settings) state.settings = { targetSets: 10 };
        if (!state.customExercises) state.customExercises = [];
        saveState(); render(); toast('読み込みました');
      } catch { toast('読み込みに失敗しました'); }
    };
    rd.readAsText(f);
  });
  $('#btnWipe').addEventListener('click', e => {
    armConfirm(e.currentTarget, 'もう一度押すと全削除', () => {
      state = { logs: [], customExercises: [], favorites: [], settings: { targetSets: 10 } };
      saveState(); render(); toast('削除しました');
    });
  });
  $('#btnDemo').addEventListener('click', () => {
    const mk = (daysAgo, exId, sets) => ({ id:'d'+exId+daysAgo, date: addDays(today(), -daysAgo), exId, sets });
    state.logs.push(
      mk(0,'benchpress',[{w:60,r:10},{w:70,r:8},{w:70,r:7}]),
      mk(0,'dbfly',[{w:12,r:12},{w:12,r:12},{w:14,r:10}]),
      mk(0,'pressdown',[{w:25,r:12},{w:30,r:10}]),
      mk(1,'squat',[{w:80,r:8},{w:90,r:6},{w:90,r:6}]),
      mk(1,'legcurl',[{w:35,r:12},{w:40,r:10}]),
      mk(1,'calfraise',[{w:60,r:15},{w:60,r:15}]),
      mk(3,'latpulldown',[{w:50,r:10},{w:55,r:8},{w:55,r:8}]),
      mk(3,'seatedrow',[{w:45,r:12},{w:50,r:10}]),
      mk(3,'dbcurl',[{w:12,r:10},{w:14,r:8}]),
      mk(5,'ohp',[{w:40,r:8},{w:40,r:8},{w:42.5,r:6}]),
      mk(5,'sideraise',[{w:8,r:15},{w:8,r:12},{w:10,r:10}]),
      mk(5,'crunch',[{w:0,r:20},{w:0,r:20}]),
    );
    saveState(); toast('サンプルデータを追加しました'); switchView('home');
  });
}

/* ---------- 初期化 ---------- */
// 表示テーマ: auto=端末設定に追従 / light・darkは強制
function applyTheme() {
  const t = state.settings.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
applyTheme();
$('#todayLabel').textContent = jpDate(today());
render();
// PWA: httpで配信されている場合のみオフライン用のservice workerを登録(ローカルファイルでは何もしない)
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
